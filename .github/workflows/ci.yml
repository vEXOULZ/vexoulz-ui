name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: vEXOULZ/conventions/.github/workflows/conventions-check.yml@v2.0.0
    secrets: inherit

  ci:
    # Installs with --ignore-scripts, so `prepare` (the build) runs only as its own step; `pack` checks
    # what a git install of a tag would get.
    uses: vEXOULZ/conventions/.github/workflows/node-ci.yml@v2.0.0
    with:
      pack: true

  # The Histoire build, so a story that no longer compiles fails the PR.
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run story:build
